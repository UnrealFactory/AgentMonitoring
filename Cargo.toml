[workspace]
members = ["src-tauri", "crates/agentmon-core", "crates/agentmon-cli"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
agentmon-core = { path = "crates/agentmon-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
