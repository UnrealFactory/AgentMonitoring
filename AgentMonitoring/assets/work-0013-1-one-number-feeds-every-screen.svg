<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 830" width="700" height="830" role="img" aria-label="Both routes a change can take — an event on the desktop, a poll in the browser — end at one number that all eight screen loaders watch.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no
       taller than half again that. The narrowest column a record page gives a picture is
       395, so this arrives a shade over half size and 22 comes back as 12 — over the 11 at
       the bottom of this app's type scale. Type is asked for by role, never by name: an
       <img> is a document of its own and cannot reach the Inter this app bundles, so the
       reader's own interface face sets these labels and every one keeps a fifth of its box
       empty. Icons in one band, their labels in the next, the closing line in its own band
       at the foot — nothing overlaps at any width the page draws this at.
       The eight chips carry no names: this record gives a count, not a list.

       Every actor, arrow, label and number below is a sentence of this record:
         · the page and its label — "Something writes a record into the project folder."
         · the two cards — "On the desktop that arrives as an event; in a browser the page asks a small address, /vault-api/cursor, every two seconds"
         · the accent box — "Either way it nudges a single number"
         · the eight blank chips — "all eight of the app’s screen loaders watch that number" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="700" height="830" rx="8" fill="#121317"/>

  <path d="M320,36 h40 l20,20 v58 h-60 z" fill="none" stroke="#e8e9eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
     <path d="M360,36 v20 h20" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
     <line x1="332" y1="72" x2="368" y2="72" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
     <line x1="332" y1="88" x2="368" y2="88" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
     <line x1="332" y1="104" x2="356" y2="104" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="350" y1="124" x2="350" y2="158" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M342.6603118449277,141.56439907437846 L350,158 L357.3396881550723,141.56439907437846" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s" x="350" y="200" font-size="22" fill="#8a8f98" text-anchor="middle">something writes a record into the project folder</text>
  <path d="M350 222 V246 M185 246 H515 M185 246 V262 M515 246 V262" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M176 254 l9 11 l9 -11 M506 254 l9 11 l9 -11" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28.5" y="286.5" width="311" height="109" rx="10" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s" x="52" y="328" font-size="22" fill="#8a8f98">on the desktop</text>
  <text class="s" x="52" y="370" font-size="22" fill="#e8e9eb">it arrives as an event</text>
  <rect x="360.5" y="286.5" width="311" height="179" rx="10" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s" x="384" y="328" font-size="22" fill="#8a8f98">in a browser</text>
  <text class="s" x="384" y="370" font-size="22" fill="#e8e9eb">the page asks</text>
  <text class="m" x="384" y="412" font-size="22" fill="#a5adf0"><tspan class="m">/vault-api/cursor</tspan></text>
  <text class="s" x="384" y="452" font-size="22" fill="#8a8f98">every two seconds</text>
  <path d="M185 396 V500 M515 466 V500 M185 500 H515 M350 500 V524" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M341 516 l9 11 l9 -11" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="205.5" y="540.5" width="289" height="71" rx="10" fill="#5e6ad2" fill-opacity="0.10" stroke="#5e6ad2" stroke-opacity="0.45"/>
  <text class="s" x="350" y="584" font-size="22" fill="#e8e9eb" text-anchor="middle">a single number</text>
  <line x1="350" y1="612" x2="350" y2="648" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M342.6603118449277,631.5643990743785 L350,648 L357.3396881550723,631.5643990743785" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="160.5" y="660.5" width="379" height="139" rx="10" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s" x="350" y="702" font-size="22" fill="#e8e9eb" text-anchor="middle">all eight screen loaders</text>
  <g fill="#5e6ad2" fill-opacity="0.14" stroke="#5e6ad2" stroke-opacity="0.4">
