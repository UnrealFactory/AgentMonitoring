<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Both routes a change can take — an event on the desktop, a poll in the browser — end at one number that all eight screen loaders watch.">
  <!-- Drawn on a 700 grid, no taller than half again that. The narrowest column a record
       page gives a picture is 395, so this arrives a shade over half size: halve every
       number below and what comes back is still 11 or more, the bottom of this app's type
       scale. Nothing under 22. Type is the reader's own interface face — an <img> is a
       document of its own and cannot reach the Inter this app bundles — so every label
       keeps a fifth of its box empty, which covers the widest face it may land in.
       The eight chips carry no names: this record gives a count, not a list. -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
    .box  { font-size: 22px; fill: #e8e9eb; }
    .tag  { font-size: 22px; fill: #8a8f98; }
    .wire { stroke: #8a8f98; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="700" height="700" rx="8" fill="#121317"/>

  <!-- ─────────────────────────── the write ──────────────────────────────── -->
  <rect x="140.5" y="28.5" width="419" height="93" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s box" x="350" y="68" text-anchor="middle">something writes a record</text>
  <text class="s box" x="350" y="100" text-anchor="middle">into the project folder</text>

  <!-- fork -->
  <path class="wire" d="M350 122 V146 M185 146 H514 M185 146 V158 M514 146 V158"/>
  <path class="wire" d="M177 152 l8 10 l8 -10 M506 152 l8 10 l8 -10"/>

  <!-- ─────────────────────────── the two transports ─────────────────────── -->
  <rect x="28.5" y="166.5" width="313" height="103" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s tag" x="46" y="202">on the desktop</text>
  <text class="s box" x="46" y="244">it arrives as an event</text>

  <rect x="357.5" y="166.5" width="313" height="183" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s tag" x="376" y="202">in a browser</text>
  <text class="s box" x="376" y="244">the page asks</text>
  <text class="m" x="376" y="286" font-size="22" fill="#a5adf0">/vault-api/cursor</text>
  <text class="s tag" x="376" y="324">every two seconds</text>

  <!-- merge -->
  <path class="wire" d="M185 270 V376 M514 350 V376 M185 376 H514 M350 376 V398"/>
  <path class="wire" d="M342 392 l8 10 l8 -10"/>

  <!-- ─────────────────────────── the one number ─────────────────────────── -->
  <rect x="205.5" y="416.5" width="289" height="71" rx="8" fill="#5e6ad2" fill-opacity="0.16" stroke="#5e6ad2" stroke-opacity="0.55"/>
  <text class="s box" x="350" y="460" text-anchor="middle">a single number</text>

  <path class="wire" d="M350 488 V512"/>
  <path class="wire" d="M342 506 l8 10 l8 -10"/>

  <!-- ─────────────────────────── the eight loaders ──────────────────────── -->
  <rect x="160.5" y="530.5" width="379" height="141" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s box" x="350" y="572" text-anchor="middle">all eight screen loaders</text>
  <g fill="#5e6ad2" fill-opacity="0.14" stroke="#5e6ad2" stroke-opacity="0.4">
    <rect x="236.5" y="596.5" width="47" height="22" rx="4"/>
    <rect x="295.5" y="596.5" width="47" height="22" rx="4"/>
    <rect x="354.5" y="596.5" width="47" height="22" rx="4"/>
    <rect x="413.5" y="596.5" width="47" height="22" rx="4"/>
    <rect x="236.5" y="630.5" width="47" height="22" rx="4"/>
    <rect x="295.5" y="630.5" width="47" height="22" rx="4"/>
    <rect x="354.5" y="630.5" width="47" height="22" rx="4"/>
    <rect x="413.5" y="630.5" width="47" height="22" rx="4"/>
  </g>
</svg>
