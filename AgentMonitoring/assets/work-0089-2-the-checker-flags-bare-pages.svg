<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="The project checker reads every page; a page whose beats carry scenes passes quietly, a page of beats with no scene anywhere is flagged.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no
       taller than half again that; at the 395 column every 22 lands at 12.5, over the 11
       floor. Type by role, never by name; every label keeps a fifth of its box empty.
       Icons in one band, their words in the next, the closing line in its own band.

       Every actor, arrow, label and number below is a sentence of this record:
         · the eye — "agentmon doctor, the command that reads a whole project's records and lists what is untidy"
         · the arrow "reads every page" — the same sentence
         · the left page, lines opening on lit boxes, green — "a page whose beats carry their scenes passes quietly"
         · the right page, bare lines, the orange mark — "a page of beats with no scene anywhere is flagged"
         · the closing line and its number — "the first run on this very project flagged 109 records" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="700" height="340" rx="8" fill="#121317"/>

  <!-- the checker -->
  <path d="M56,85 q46,-36 92,0 q-46,36 -92,0 z" fill="none" stroke="#e8e9eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="85" r="11" fill="#a5adf0"/>

  <!-- reads every page -->
  <text class="s" x="257" y="64" font-size="22" fill="#8a8f98" text-anchor="middle">reads every page</text>
  <line x1="174" y1="85" x2="340" y2="85" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M323.5,92.3 L340,85 L323.5,77.7" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a page whose beats carry their scenes -->
  <path d="M388,44 h44 l20,20 v66 h-64 z" fill="none" stroke="#e8e9eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M432,44 v20 h20" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="75" width="13" height="11" rx="2" fill="none" stroke="#4cb782" stroke-width="2.2"/>
  <line x1="421" y1="81" x2="440" y2="81" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="400" y="94" width="13" height="11" rx="2" fill="none" stroke="#4cb782" stroke-width="2.2"/>
  <line x1="421" y1="100" x2="440" y2="100" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M400,124 l8,8 l16,-16" fill="none" stroke="#4cb782" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a page of beats with no scene anywhere -->
  <path d="M568,44 h44 l20,20 v66 h-64 z" fill="none" stroke="#e8e9eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M612,44 v20 h20" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="580" y1="81" x2="620" y2="81" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="580" y1="100" x2="620" y2="100" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="580" y1="119" x2="608" y2="119" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="588" cy="128" r="12" fill="none" stroke="#f2994a" stroke-width="2.4"/>
  <line x1="588" y1="121" x2="588" y2="129" stroke="#f2994a" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="588" cy="134" r="1.4" fill="#f2994a"/>

  <!-- the words band -->
  <text class="m" x="36" y="176" font-size="22" fill="#a5adf0">agentmon doctor</text>
  <text class="s" x="36" y="208" font-size="22" fill="#8a8f98">reads the whole project</text>
  <text class="s" x="420" y="176" font-size="22" fill="#4cb782" text-anchor="middle">has its scenes</text>
  <text class="s" x="600" y="176" font-size="22" fill="#f2994a" text-anchor="middle">no scene</text>
  <text class="s" x="600" y="208" font-size="22" fill="#8a8f98" text-anchor="middle">flagged</text>

  <!-- the closing line -->
  <text class="s" x="350" y="284" font-size="22" fill="#8a8f98" text-anchor="middle">its first run flagged <tspan fill="#f2994a">109</tspan> pages here</text>
</svg>
