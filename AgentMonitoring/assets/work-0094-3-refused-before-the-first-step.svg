<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="한 번에 보내는 기록-닫기 두 걸음: 전에는 거절이 두 걸음 사이에 서서 기록만 남았고, 이제는 첫걸음 앞에 서서 아무것도 쓰이지 않는다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0094):
         · the two boxes of each row — "앱은 기록을 만들고 나서 닫습니다"
         · the top row's filled first box and the red bar between the boxes — "끝난 시각이
           몇 초 미래라서 닫기가 거절되면, 기록만 생기고 닫히지 않은 반쪽 상태가
           남았습니다"
         · the bottom row's red bar before the first box, both boxes empty — "이제 그
           검사를 기록을 만들기 전에 먼저 합니다. 거절되면 아무것도 안 쓰인 채로 거절만
           돌아갑니다"
         · the closing line — the same two sentences, folded into one -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="470" rx="8" fill="#121317"/>

  <!-- before: the record made, the close refused -->
  <rect x="150.5" y="64.5" width="120" height="60" rx="8" fill="#1d1e23" stroke="#f2994a" stroke-width="2"/>
  <line x1="168" y1="88" x2="252" y2="88" stroke="#e8e9eb" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="168" y1="104" x2="232" y2="104" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="282" y1="94" x2="330" y2="94" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the refusal standing between the steps -->
  <line x1="348" y1="64" x2="348" y2="124" stroke="#eb5757" stroke-width="4" stroke-linecap="round"/>
  <path d="M334,80 L362,108 M362,80 L334,108" stroke="#eb5757" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="382.5" y="64.5" width="120" height="60" rx="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-dasharray="7 6"/>

  <!-- now: the refusal standing before the first step -->
  <line x1="118" y1="196" x2="118" y2="256" stroke="#eb5757" stroke-width="4" stroke-linecap="round"/>
  <path d="M104,212 L132,240 M132,212 L104,240" stroke="#eb5757" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="150.5" y="196.5" width="120" height="60" rx="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-dasharray="7 6"/>
  <line x1="282" y1="226" x2="330" y2="226" stroke="#8a8f98" stroke-opacity="0.5" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="382.5" y="196.5" width="120" height="60" rx="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-dasharray="7 6"/>

  <!-- the words band -->
  <text class="s" x="216" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">전에는</text>
  <text class="s" x="216" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">기록만 남고 닫기 실패</text>
  <text class="s" x="484" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">이제는</text>
  <text class="s" x="484" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">쓰기 전에 거절</text>

  <!-- the closing line -->
  <text class="s" x="350" y="420" font-size="22" fill="#8a8f98" text-anchor="middle">거절이 첫걸음 앞으로 옮겨져 반쪽 기록이 안 생깁니다</text>
</svg>
