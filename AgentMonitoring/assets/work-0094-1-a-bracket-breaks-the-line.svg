<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="같은 파일 목록 줄 두 가지: 대괄호 경로를 따옴표 없이 적은 줄은 못 읽는 글이 되고, 따옴표로 감싼 줄은 그대로 읽힌다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0094):
         · the left line panel, its middle chip carrying orange bracket ticks — "파일
           이름에 대괄호가 든 경로 … 가 오면"
         · the left broken tail — "그 대괄호가 목록의 여는 괄호로 잘못 읽혀 줄이 통째로
           못 읽는 글이 됐습니다"
         · the right line panel, the same chip inside green quote ticks — "이제 목록에
           적히는 값에 대괄호·중괄호·쉼표가 들어 있으면 저장할 때 따옴표로 감쌉니다"
         · the right intact tail — "따옴표로 감싼 줄은 그대로 읽힙니다"
         · the closing line — same sentence as the right panel's -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="470" rx="8" fill="#121317"/>

  <!-- the unquoted line: three list chips, the middle one wearing naked brackets -->
  <rect x="60.5" y="60.5" width="240" height="64" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="78" y="86" width="42" height="13" rx="3" fill="#8a8f98"/>
  <path d="M136,80 v26 M136,80 h7 M136,106 h7" fill="none" stroke="#f2994a" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="150" y="86" width="42" height="13" rx="3" fill="#f2994a"/>
  <path d="M206,80 v26 M206,80 h-7 M206,106 h-7" fill="none" stroke="#f2994a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the tail of the line after the bracket: torn -->
  <path d="M222,92 l14,0 M244,86 l10,12 M254,86 l-10,12" fill="none" stroke="#eb5757" stroke-width="2.4" stroke-linecap="round"/>

  <!-- the quoted line: the same chips, the bracket pair held inside quote ticks -->
  <rect x="400.5" y="60.5" width="240" height="64" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="418" y="86" width="42" height="13" rx="3" fill="#8a8f98"/>
  <path d="M472,78 l-4,10 M480,78 l-4,10" stroke="#4cb782" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="488" y="86" width="42" height="13" rx="3" fill="#4cb782"/>
  <path d="M540,78 l-4,10 M548,78 l-4,10" stroke="#4cb782" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="560" y1="92" x2="622" y2="92" stroke="#8a8f98" stroke-width="2.4" stroke-linecap="round"/>

  <!-- what each spelling becomes -->
  <line x1="180" y1="140" x2="180" y2="172" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M172.7,155.6 L180,172 L187.3,155.6" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="520" y1="140" x2="520" y2="172" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M512.7,155.6 L520,172 L527.3,155.6" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- left result: the whole page refused (a crossed sheet) -->
  <rect x="120.5" y="186.5" width="120" height="88" rx="8" fill="#16171a" stroke="#eb5757" stroke-opacity="0.8" stroke-width="2"/>
  <line x1="138" y1="210" x2="222" y2="210" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="138" y1="230" x2="206" y2="230" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M150,198 L212,262 M212,198 L150,262" stroke="#eb5757" stroke-width="2.6" stroke-linecap="round"/>

  <!-- right result: the same sheet, read whole -->
  <rect x="460.5" y="186.5" width="120" height="88" rx="8" fill="#16171a" stroke="#4cb782" stroke-opacity="0.8" stroke-width="2"/>
  <line x1="478" y1="210" x2="562" y2="210" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="478" y1="230" x2="546" y2="230" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M486,252 l10,10 l20,-20" fill="none" stroke="#4cb782" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the words band -->
  <text class="s" x="180" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">따옴표 없음</text>
  <text class="s" x="180" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">줄이 못 읽는 글이 됨</text>
  <text class="s" x="520" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">따옴표로 감쌈</text>
  <text class="s" x="520" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">그대로 읽힘</text>

  <!-- the closing line -->
  <text class="s" x="350" y="420" font-size="22" fill="#8a8f98" text-anchor="middle">괄호나 쉼표가 든 값은 저장할 때 따옴표로 감쌉니다</text>
</svg>
