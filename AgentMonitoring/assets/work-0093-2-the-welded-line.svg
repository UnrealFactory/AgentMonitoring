<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="같은 인용 두 가지 철자: 빈 줄 없이 리드인에 붙여 쓴 그림 줄은 같은 문단이 되어 글자 취급으로 그려지고, 앞뒤에 빈 줄을 둔 그림 줄은 제 문단이 되어 그림으로 그려진다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0093):
         · the left source panel, its chip touching the lead-in bar — "굵은 리드인 바로
           아랫줄에 그림을 붙이게 했습니다"
         · the left result, a chip inside a text line — "그 그림은 문장 속 글자 취급이
           됩니다"
         · the right source panel, blank lines around the chip — "그림 줄 앞뒤로 빈 줄
           하나씩"
         · the right result, a wide panel — "제 문단으로 승급됩니다"
         · the closing line — "한 줄을 통째로 차지한 그림은 이제 어디에 있든 제 문단으로
           승급됩니다" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="470" rx="8" fill="#121317"/>

  <!-- source, welded: the image line touching the lead-in -->
  <rect x="135.5" y="44.5" width="130" height="96" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="151" y="60" width="70" height="11" rx="3" fill="#e8e9eb"/>
  <rect x="151" y="75" width="54" height="11" rx="2" fill="none" stroke="#f2994a" stroke-width="2"/>
  <line x1="151" y1="104" x2="249" y2="104" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="151" y1="122" x2="229" y2="122" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <!-- source, blank-lined: the image line as a paragraph of its own -->
  <rect x="435.5" y="44.5" width="130" height="96" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="451" y="58" width="70" height="11" rx="3" fill="#e8e9eb"/>
  <rect x="451" y="84" width="54" height="11" rx="2" fill="none" stroke="#4cb782" stroke-width="2"/>
  <line x1="451" y1="112" x2="549" y2="112" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="451" y1="126" x2="529" y2="126" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <line x1="200" y1="150" x2="200" y2="182" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M192.7,165.6 L200,182 L207.3,165.6" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="500" y1="150" x2="500" y2="182" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M492.7,165.6 L500,182 L507.3,165.6" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- what each spelling renders as -->
  <rect x="135.5" y="190.5" width="130" height="74" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <line x1="151" y1="214" x2="185" y2="214" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="191" y="207" width="16" height="12" rx="2" fill="none" stroke="#f2994a" stroke-width="2"/>
  <line x1="213" y1="214" x2="249" y2="214" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="151" y1="238" x2="249" y2="238" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="435.5" y="190.5" width="130" height="74" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="449" y="202" width="102" height="36" rx="4" fill="none" stroke="#4cb782" stroke-opacity="0.85" stroke-width="2.2"/>
  <line x1="451" y1="252" x2="549" y2="252" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <!-- the words band -->
  <text class="s" x="200" y="310" font-size="22" fill="#e8e9eb" text-anchor="middle">빈 줄 없음</text>
  <text class="s" x="200" y="342" font-size="22" fill="#8a8f98" text-anchor="middle">같은 문단 · 글자 취급</text>
  <text class="s" x="500" y="310" font-size="22" fill="#e8e9eb" text-anchor="middle">빈 줄 하나씩</text>
  <text class="s" x="500" y="342" font-size="22" fill="#8a8f98" text-anchor="middle">제 문단 · 그림</text>

  <!-- the closing line -->
  <text class="s" x="350" y="414" font-size="22" fill="#8a8f98" text-anchor="middle">한 줄을 통째로 쓴 그림 줄은 이제 그림으로 승급됩니다</text>
</svg>
