<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="깨진 기록 하나를 만난 목록 두 가지: 전에는 목록 전체가 잠겼고, 이제는 그 기록 하나만 건너뛰고 나머지를 보여준다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0094):
         · the red row in both stacks — "못 읽는 파일 하나"
         · the left stack, every row dimmed behind a lock — "못 읽는 파일 하나를 만나면
           읽기 전체를 포기했습니다 … 목록도, 현황도, 새 저장도 전부 막혔습니다"
         · the right stack, the red row dashed and the rest bright — "목록은 그 파일만
           건너뛰고 나머지를 보여줍니다"
         · the closing line — "건너뛴 사실은 숨지 않습니다 — 점검 명령 agentmon doctor가
           그 파일 이름과 깨진 자리를 짚어 줍니다" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="470" rx="8" fill="#121317"/>

  <!-- before: one red row, and the whole stack behind a lock -->
  <g opacity="0.38">
    <rect x="90.5" y="52.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
    <line x1="106" y1="69" x2="238" y2="69" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="90.5" y="94.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
    <line x1="106" y1="111" x2="218" y2="111" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="90.5" y="178.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
    <line x1="106" y1="195" x2="230" y2="195" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <rect x="90.5" y="136.5" width="220" height="34" rx="6" fill="#16171a" stroke="#eb5757" stroke-width="2"/>
  <line x1="106" y1="153" x2="196" y2="153" stroke="#eb5757" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the lock over the whole stack -->
  <rect x="176" y="230" width="48" height="34" rx="6" fill="none" stroke="#eb5757" stroke-width="2.6"/>
  <path d="M186,230 v-10 a14,14 0 0 1 28,0 v10" fill="none" stroke="#eb5757" stroke-width="2.6"/>

  <!-- now: the same stack, only the red row set aside -->
  <rect x="390.5" y="52.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <line x1="406" y1="69" x2="538" y2="69" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="390.5" y="94.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <line x1="406" y1="111" x2="518" y2="111" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="390.5" y="136.5" width="220" height="34" rx="6" fill="none" stroke="#eb5757" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="406" y1="153" x2="496" y2="153" stroke="#eb5757" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="390.5" y="178.5" width="220" height="34" rx="6" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <line x1="406" y1="195" x2="530" y2="195" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M478,238 l12,12 l24,-24" fill="none" stroke="#4cb782" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the words band -->
  <text class="s" x="200" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">전에는</text>
  <text class="s" x="200" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">하나 깨지면 전부 잠김</text>
  <text class="s" x="500" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">이제는</text>
  <text class="s" x="500" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">그 하나만 건너뜀</text>

  <!-- the closing line -->
  <text class="s" x="350" y="420" font-size="22" fill="#8a8f98" text-anchor="middle">건너뛴 파일은 점검 명령이 이름으로 짚어 줍니다</text>
</svg>
