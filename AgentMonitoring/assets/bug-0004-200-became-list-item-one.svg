<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 898" width="700" height="898" role="img" aria-label="One stored sentence whose second line begins 200. is drawn as three blocks, with a 1. where the 200 was.">
  <!-- Drawn on a 700 grid, no taller than half again that. The narrowest column a record
       page gives a picture is 395, so this arrives a shade over half size: halve every
       number below and what comes back is still 11 or more, the bottom of this app's type
       scale. Nothing under 22. Type is the reader's own interface face — an <img> is a
       document of its own and cannot reach the Inter this app bundles.
       The sentence is set in that reading face, not in monospace: it is this record's
       retelling, not a quotation of the stored bytes. Monospace is kept for the two
       literals the record names, 200. and 1., and for the file it names. -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
    .lbl  { font-size: 22px; fill: #8a8f98; }
    .kind { font-size: 22px; fill: #8a8f98; }
    .line { font-size: 22px; fill: #e8e9eb; }
    .cap  { font-size: 22px; fill: #8a8f98; }
  </style>

  <rect width="700" height="898" rx="8" fill="#121317"/>

  <!-- ─────────────────────────── what the record holds ──────────────────── -->
  <text class="s lbl" x="28" y="36">what the record holds</text>

  <rect x="28.5" y="52.5" width="643" height="142" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s kind" x="48" y="88">one sentence</text>
  <text class="s line" x="48" y="128">…answered 503 for three hours, then</text>
  <text class="m line" x="48" y="168"><tspan fill="#4cb782">200.</tspan> …</text>

  <text class="s cap" x="28" y="230">too long for one line, so it wrapped</text>

  <!-- the renderer, between the two -->
  <path d="M350 256 V296" stroke="#8a8f98" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M341 288 l9 11 l9 -11" stroke="#8a8f98" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ─────────────────────────── what the page drew ─────────────────────── -->
  <text class="s lbl" x="28" y="344">what the page drew</text>

  <rect x="28.5" y="360.5" width="643" height="88" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s kind" x="48" y="396">paragraph</text>
  <text class="s line" x="48" y="434">…answered 503 for three hours, then</text>

  <rect x="28.5" y="460.5" width="643" height="88" rx="8" fill="#f2994a" fill-opacity="0.08" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s kind" x="48" y="496" fill="#f2994a">list item</text>
  <text class="m line" x="48" y="534"><tspan fill="#f2994a">1.</tspan> …</text>

  <rect x="28.5" y="560.5" width="643" height="88" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s kind" x="48" y="596">paragraph</text>
  <text class="s line" x="48" y="634">…</text>

  <text class="s cap" x="28" y="688">one sentence, broken into three —</text>
  <text class="s cap" x="28" y="718">the <tspan class="m" fill="#4cb782">200</tspan> gone, a <tspan class="m" fill="#f2994a">1.</tspan> in its place</text>

  <!-- ─────────────────────────── the test that did it ───────────────────── -->
  <line x1="28" y1="752" x2="672" y2="752" stroke="#fff" stroke-opacity="0.06"/>
  <text class="m" x="350" y="794" text-anchor="middle" font-size="22" fill="#a5adf0">src/lib/markdown.tsx<tspan class="s cap"> asked one test:</tspan></text>
  <text class="s line" x="350" y="832" text-anchor="middle">does a numbered list start on this line?</text>
  <text class="s cap" x="350" y="868" text-anchor="middle"><tspan class="m" fill="#4cb782">200.</tspan> said yes.</text>
</svg>
