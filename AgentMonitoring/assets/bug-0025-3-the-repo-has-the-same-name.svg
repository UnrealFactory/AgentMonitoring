<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" role="img" aria-label="Every file in the repository — the app's code, the scripts, the settings file — skipped, with the watcher shut and never restarting.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no
       taller than half again that. The narrowest column a record page gives a picture is
       395, so this arrives a shade over half size and 22 comes back as 12 — over the 11 at
       the bottom of this app's type scale. Type is asked for by role, never by name: an
       <img> is a document of its own and cannot reach the Inter this app bundles, so the
       reader's own interface face sets these labels and every one keeps a fifth of its box
       empty. Icons in one band, their labels in the next, the closing line in its own band
       at the foot — nothing overlaps at any width the page draws this at.
       Three files, because the beat names three. The shut eye is the watcher of scene 2, seeing nothing.

       Every actor, arrow, label and number below is a sentence of this record:
         · the folder and its label — "But the repository is itself named AgentMonitoring." / "That is the project’s own folder on disk"
         · the three pages and their labels — "the app’s code, the scripts, and the settings file carrying the rule"
         · the "skipped — all of them" pill — "So the watcher skipped all of them"
         · the shut eye and "the watcher saw none of it" — "It could not see its own settings change either"
         · the closing lines — "It could not see its own settings change either, so it never restarted itself." -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="700" height="620" rx="8" fill="#121317"/>

