  <text class="s" x="350" y="542" font-size="22" fill="#8a8f98" text-anchor="middle">It could not see its own settings change either,</text>
  <text class="s" x="350" y="574" font-size="22" fill="#8a8f98" text-anchor="middle">so it never restarted itself.</text>
</svg>
