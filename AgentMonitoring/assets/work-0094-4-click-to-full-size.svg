<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="본문 폭 카드 속 그림을 누르면 같은 그림이 화면 크기로 열리고, Esc나 빈 곳을 누르면 닫힌다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0094):
         · the small card with the picture chip and the pointer on it — "기록에 붙는
           사진과 도면은 지금까지 본문 폭 카드 안에서만 보였습니다" · "이제 그림을
           누르면"
         · the wide dark panel holding the same picture large — "화면 크기로 열리고"
         · the closing line — "Esc나 아무 곳 클릭으로 닫힙니다" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="470" rx="8" fill="#121317"/>

  <!-- the record page, its picture a card in the text column -->
  <rect x="70.5" y="52.5" width="180" height="200" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="88" y="70" width="86" height="12" rx="3" fill="#e8e9eb"/>
  <line x1="88" y1="100" x2="232" y2="100" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="88" y1="118" x2="212" y2="118" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="88.5" y="136.5" width="80" height="52" rx="4" fill="none" stroke="#4cb782" stroke-width="2"/>
  <circle cx="106" cy="152" r="5" fill="none" stroke="#8a8f98" stroke-width="2"/>
  <path d="M92,182 l20,-18 l14,12 l16,-14 l22,20" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="88" y1="212" x2="232" y2="212" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="88" y1="230" x2="204" y2="230" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the pointer on the card -->
  <path d="M158,176 l0,26 l7,-7 l6,12 l7,-4 l-6,-11 l10,-1 z" fill="#e8e9eb" stroke="#121317" stroke-width="1.4"/>

  <!-- the press, and what opens -->
  <line x1="272" y1="152" x2="336" y2="152" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M319.4,144.7 L336,152 L319.4,159.3" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the full-size view: the same picture, wide as the screen -->
  <rect x="360.5" y="52.5" width="280" height="200" rx="8" fill="#0b0c0e" stroke="#fff" stroke-opacity="0.14"/>
  <rect x="382.5" y="74.5" width="236" height="132" rx="4" fill="none" stroke="#4cb782" stroke-width="2.4"/>
  <circle cx="428" cy="112" r="12" fill="none" stroke="#8a8f98" stroke-width="2.4"/>
  <path d="M392,192 l58,-52 l40,34 l46,-40 l64,58" fill="none" stroke="#8a8f98" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="472" y="222" width="56" height="18" rx="4" fill="none" stroke="#8a8f98" stroke-opacity="0.7" stroke-width="2"/>

  <!-- the words band -->
  <text class="s" x="160" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">본문 속 카드</text>
  <text class="s" x="160" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">본문 폭까지만</text>
  <text class="s" x="500" y="322" font-size="22" fill="#e8e9eb" text-anchor="middle">누르면 화면 크기</text>
  <text class="s" x="500" y="354" font-size="22" fill="#8a8f98" text-anchor="middle">사진도 도면도 같게</text>

  <!-- the closing line -->
  <text class="s" x="350" y="420" font-size="22" fill="#8a8f98" text-anchor="middle">Esc나 빈 곳을 누르면 닫힙니다</text>
</svg>
