<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 812" width="700" height="812" role="img" aria-label="The rule was meant to skip the records folder; the repository has the same name, so it skipped every file in it.">
  <!-- Drawn on a 700 grid, no taller than half again that. The narrowest column a record
       page gives a picture is 395, so this arrives a shade over half size: halve every
       number below and what comes back is still 11 or more, the bottom of this app's type
       scale. Nothing under 22. Type is the reader's own interface face — an <img> is a
       document of its own and cannot reach the Inter this app bundles — so every label
       keeps a fifth of its box empty, which covers the widest face it may land in. -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
    .lbl  { font-size: 22px; fill: #8a8f98; }
    .head { font-size: 22px; fill: #8a8f98; }
    .row  { font-size: 22px; fill: #e8e9eb; }
    .gloss{ font-size: 22px; fill: #8a8f98; }
    .pill { font-size: 22px; }
    .idx  { fill: #a5adf0; }
  </style>

  <rect width="700" height="812" rx="8" fill="#121317"/>

  <!-- ─────────────────────────── what the rule was meant to do ──────────── -->
  <text class="s lbl" x="28" y="36">what the rule was meant to do</text>

  <rect x="28.5" y="52.5" width="643" height="251" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s head" x="48" y="90">the repository, itself named <tspan class="m idx">AgentMonitoring</tspan></text>
  <line x1="28" y1="108" x2="672" y2="108" stroke="#fff" stroke-opacity="0.06"/>

  <text class="s row" x="48" y="148">the app’s code</text>
  <rect x="548.5" y="126.5" width="99" height="29" rx="14.5" fill="#4cb782" fill-opacity="0.14" stroke="#4cb782" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="148" text-anchor="middle" fill="#4cb782">noticed</text>

  <text class="s row" x="48" y="192">the scripts</text>
  <rect x="548.5" y="170.5" width="99" height="29" rx="14.5" fill="#4cb782" fill-opacity="0.14" stroke="#4cb782" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="192" text-anchor="middle" fill="#4cb782">noticed</text>

  <text class="m row" x="48" y="236">vite.config.ts<tspan class="s gloss"> the settings file</tspan></text>
  <rect x="548.5" y="214.5" width="99" height="29" rx="14.5" fill="#4cb782" fill-opacity="0.14" stroke="#4cb782" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="236" text-anchor="middle" fill="#4cb782">noticed</text>

  <text class="m row idx" x="48" y="280">AgentMonitoring/<tspan class="s gloss"> the records folder</tspan></text>
  <rect x="548.5" y="258.5" width="99" height="29" rx="14.5" fill="#f2994a" fill-opacity="0.14" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="280" text-anchor="middle" fill="#f2994a">skipped</text>

  <!-- ─────────────────────────── the rule itself ────────────────────────── -->
  <rect x="133.5" y="336.5" width="433" height="62" rx="6" fill="#0e0f11" stroke="#fff" stroke-opacity="0.09"/>
  <text class="m" x="350" y="375" text-anchor="middle" font-size="28" fill="#e8e9eb">**/<tspan class="idx">AgentMonitoring</tspan>/**</text>
  <text class="s gloss" x="350" y="432" text-anchor="middle">any path with a folder</text>
  <text class="s gloss" x="350" y="462" text-anchor="middle">called <tspan class="m idx">AgentMonitoring</tspan> in it</text>

  <!-- ─────────────────────────── what it did ────────────────────────────── -->
  <text class="s lbl" x="28" y="520">what it did</text>

  <rect x="28.5" y="536.5" width="643" height="251" rx="8" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <text class="s head" x="48" y="574">the repository, itself named <tspan class="m idx">AgentMonitoring</tspan></text>
  <line x1="28" y1="592" x2="672" y2="592" stroke="#fff" stroke-opacity="0.06"/>

  <text class="s row" x="48" y="632">the app’s code</text>
  <rect x="548.5" y="610.5" width="99" height="29" rx="14.5" fill="#f2994a" fill-opacity="0.14" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="632" text-anchor="middle" fill="#f2994a">skipped</text>

  <text class="s row" x="48" y="676">the scripts</text>
  <rect x="548.5" y="654.5" width="99" height="29" rx="14.5" fill="#f2994a" fill-opacity="0.14" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="676" text-anchor="middle" fill="#f2994a">skipped</text>

  <text class="m row" x="48" y="720">vite.config.ts<tspan class="s gloss"> the settings file</tspan></text>
  <rect x="548.5" y="698.5" width="99" height="29" rx="14.5" fill="#f2994a" fill-opacity="0.14" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="720" text-anchor="middle" fill="#f2994a">skipped</text>

  <text class="m row idx" x="48" y="764">AgentMonitoring/<tspan class="s gloss"> the records folder</tspan></text>
  <rect x="548.5" y="742.5" width="99" height="29" rx="14.5" fill="#f2994a" fill-opacity="0.14" stroke="#f2994a" stroke-opacity="0.4"/>
  <text class="s pill" x="598" y="764" text-anchor="middle" fill="#f2994a">skipped</text>
</svg>
