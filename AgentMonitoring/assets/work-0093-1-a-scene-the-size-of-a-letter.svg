<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="같은 기록 카드 둘: 제보된 화면에서는 장면이 글줄 속 글자 높이의 조각으로 끼어 있고, 있어야 할 모양에서는 카드 폭을 채운 그림으로 놓여 있다.">
  <!-- Drawn on the grid docs/HUMAN_STYLE.md sets: 700 across, nothing under 22, no taller
       than half again that; at the 395 column every 22 lands at 12.4, over the 11 floor.
       Type by role, never by name; every label keeps a fifth of its box empty.

       Every actor, arrow, label and number below is a sentence of this record (WORK-0093):
         · the left card and its inline chip — "규칙대로 넣은 장면이 화면에는 글자 한 줄
           높이로 나왔다는 소유자 제보"
         · the right card and its full panel — "카드 폭을 채워야 할 그림"
         · the closing line — "저장도 검사도 전부 통과한 채였습니다" -->
  <style>
    .s { font-family: system-ui, "Segoe UI", sans-serif; }
  </style>

  <rect width="700" height="420" rx="8" fill="#121317"/>

  <!-- the reported card: the scene folded into a line of text -->
  <rect x="115.5" y="40.5" width="170" height="170" rx="10" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="135" y="62" width="80" height="12" rx="3" fill="#e8e9eb"/>
  <line x1="135" y1="96" x2="265" y2="96" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="135" y1="118" x2="175" y2="118" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="181" y="110" width="18" height="13" rx="2" fill="none" stroke="#f2994a" stroke-width="2"/>
  <line x1="205" y1="118" x2="265" y2="118" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="135" y1="140" x2="265" y2="140" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="135" y1="162" x2="245" y2="162" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <!-- the intended card: the scene as a card-wide panel above its words -->
  <rect x="415.5" y="40.5" width="170" height="170" rx="10" fill="#16171a" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="435" y="62" width="80" height="12" rx="3" fill="#e8e9eb"/>
  <rect x="431" y="84" width="138" height="72" rx="6" fill="none" stroke="#4cb782" stroke-opacity="0.85" stroke-width="2.2"/>
  <circle cx="451" cy="102" r="5" fill="none" stroke="#8a8f98" stroke-width="2.2"/>
  <path d="M437,146 l24,-26 l16,18 l13,-14 l26,22" fill="none" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="435" y1="176" x2="565" y2="176" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="435" y1="196" x2="545" y2="196" stroke="#8a8f98" stroke-width="2.2" stroke-linecap="round"/>

  <!-- the words band -->
  <text class="s" x="200" y="262" font-size="22" fill="#e8e9eb" text-anchor="middle">제보된 화면</text>
  <text class="s" x="200" y="294" font-size="22" fill="#8a8f98" text-anchor="middle">장면이 글자 높이</text>
  <text class="s" x="500" y="262" font-size="22" fill="#e8e9eb" text-anchor="middle">있어야 할 모양</text>
  <text class="s" x="500" y="294" font-size="22" fill="#8a8f98" text-anchor="middle">카드 폭 장면</text>

  <!-- the closing line -->
  <text class="s" x="350" y="366" font-size="22" fill="#8a8f98" text-anchor="middle">저장도 검사도 이 모양을 통과시키고 있었습니다</text>
</svg>
