[package]
name = "agentmonitoring"
description = "AgentMonitoring desktop app — read the vault your agents write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The Tauri mobile/desktop entry point lives in the lib so `main.rs` stays a one-liner.
name = "agentmonitoring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentmon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
